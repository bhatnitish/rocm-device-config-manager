apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-amdgpu-device-config-manager
  labels:
    app: amdgpu-device-config-manager
  {{- include "helm-charts.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: amdgpu-device-config-manager
  template:
    metadata:
      labels:
        app: amdgpu-device-config-manager
    spec:
      serviceAccountName: {{ include "helm-charts.fullname" . }}-config-manager
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      initContainers:
      - command:
        - sh
        - -c
        - {{ if .Values.simEnabled }}"exit 0"{{ else }}"while [ ! -d /host-sys/class/kfd ] || [ ! -d /host-sys/module/amdgpu/drivers/ ]; do echo 'amdgpu driver is not loaded'; sleep 2; done"{{ end }}
        image: {{ .Values.image.initContainerImage }}
        imagePullPolicy: IfNotPresent
        name: driver-init
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host-sys
          name: sys-volume
      containers:
        - name: amdgpu-device-config-manager-container
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: DS_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          securityContext:
            privileged: true
          volumeMounts:
          - mountPath: /dev
            name: dev-volume
          - mountPath: /sys
            name: sys-volume
          - mountPath: /lib/modules
            name: libmodules
          - mountPath: /var/lib/
            name: health
          {{- $gpuCM := include "dcm.gpuConfigMapName" . }}
          - mountPath: /etc/config-manager/
            name: {{ $gpuCM }}-volume
          {{- if .Values.ainicConfigMap }}
          - mountPath: /etc/config-manager-ainic/
            name: {{ .Values.ainicConfigMap }}-volume
          {{- end }}
          - mountPath: /etc/systemd
            name: etc-systemd
          - mountPath: /run/systemd
            name: run-systemd
          - mountPath: /usr/lib/systemd
            name: usr-lib-systemd
          - mountPath: /var/run/dbus
            name: var-run-dbus
          {{- if .Values.ainicHostMounts }}
          - mountPath: /usr/sbin/nicctl
            name: nicctl
          - mountPath: /opt/amd
            name: opt-amd
          - mountPath: /etc/amd/ainic
            name: ainic-metadata
          {{- end }}

          workingDir: /root
      tolerations:
      - effect: NoExecute
        key: amd-dcm
        operator: Equal
        value: up
      volumes:
      - hostPath:
          path: /dev
          type: Directory
        name: dev-volume
      - hostPath:
          path: /sys
          type: Directory
        name: sys-volume
      - hostPath:
          path: /lib/modules
          type: Directory
        name: libmodules
      - hostPath:
          path: /var/lib/
          type: Directory
        name: health
      - hostPath:
          path: /etc/systemd
          type: Directory
        name: etc-systemd
      - hostPath:
          path: /run/systemd
          type: Directory
        name: run-systemd
      - hostPath:
          path: /usr/lib/systemd
          type: Directory
        name: usr-lib-systemd
      - hostPath:
          path: /var/run/dbus
          type: Directory
        name: var-run-dbus
      {{- if .Values.ainicHostMounts }}
      - hostPath:
          path: /usr/sbin/nicctl
          type: File
        name: nicctl
      - hostPath:
          path: /opt/amd
          type: Directory
        name: opt-amd
      - hostPath:
          path: /etc/amd/ainic
          type: Directory
        name: ainic-metadata
      {{- end }}
      {{- $gpuCM := include "dcm.gpuConfigMapName" . }}
      - name: {{ $gpuCM }}-volume
        configMap:
          name: {{ $gpuCM }}
      {{- if .Values.ainicConfigMap }}
      - name: {{ .Values.ainicConfigMap }}-volume
        configMap:
          name: {{ .Values.ainicConfigMap }}
      {{- end }}